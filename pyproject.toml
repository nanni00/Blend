[project]
name = "blend"
version = "0.3.1"
description = "Fork of \"The repository for Blend, a holistic data discovery system\""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4.3",
  "polars>=1.36.1",
  "pyarrow>=22.0.0",
  "tqdm>=4.67.1",
]

[project.optional-dependencies]
testing = [
    "scipy>=1.17.0",
    "tabulate>=0.9.0",
]
optimizer = [
    "xgboost>=3.2.0",
]
